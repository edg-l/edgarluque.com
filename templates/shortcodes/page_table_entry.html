<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" role="img" aria-labelledby="pte-title pte-desc" class="pte">
  <title id="pte-title">The layout of one 64-bit page table entry</title>
  <desc id="pte-desc">A page table entry is 64 bits. Bit 63 is no-execute, bits 62 to 52 are free for the OS, bits 51 to 12 hold the physical address of the next table or the frame, bits 11 to 9 are free for the OS, and bits 8 down to 0 are the global, page size, dirty, accessed, cache-disable, write-through, user, writable and present flags.</desc>
  <style>
    .pte { width: 100%; max-width: 760px; height: auto; margin-inline: auto; }
    .pte text { font-family: var(--font-mono); fill: var(--fg); }
    .pte .cell { font-size: 10px; text-anchor: middle; }
    .pte .cell-addr { font-size: 11px; text-anchor: middle; fill: var(--cyan); }
    .pte .tick { font-size: 9px; opacity: 0.5; text-anchor: middle; }
    .pte .note { font-size: 11px; opacity: 0.55; }
    .pte .free { font-size: 10px; text-anchor: middle; opacity: 0.5; }

    .pte .box { fill: var(--panel); stroke: var(--accent); stroke-width: 1; }
    .pte .box-addr { fill: var(--cyan); fill-opacity: 0.3; stroke: var(--cyan); stroke-width: 1.5; }
    .pte .box-free { fill: var(--panel); stroke: var(--accent); stroke-width: 1; stroke-opacity: 0.4; stroke-dasharray: 3 3; }
    .pte .box-used { fill: var(--accent); fill-opacity: 0.28; stroke: var(--accent); stroke-width: 1.5; }
  </style>

  <!-- bit 63 down to bit 0, left to right -->
  <rect class="box-used" x="20" y="30" width="36" height="30"/>
  <text class="cell" x="38" y="49">NX</text>
  <text class="tick" x="38" y="74">63</text>

  <rect class="box" x="56" y="30" width="40" height="30"/>
  <text class="cell" x="76" y="49">PK</text>
  <text class="tick" x="76" y="74">62:59</text>

  <rect class="box-free" x="96" y="30" width="40" height="30"/>
  <text class="free" x="116" y="49">free</text>
  <text class="tick" x="116" y="74">58:52</text>

  <rect class="box-addr" x="136" y="30" width="180" height="30"/>
  <text class="cell-addr" x="226" y="49">physical address</text>
  <text class="tick" x="226" y="74">51:12</text>

  <rect class="box-free" x="316" y="30" width="50" height="30"/>
  <text class="free" x="341" y="49">free</text>
  <text class="tick" x="341" y="74">11:9</text>

  <rect class="box-used" x="366" y="30" width="32" height="30"/>
  <text class="cell" x="382" y="49">G</text>
  <text class="tick" x="382" y="74">8</text>

  <rect class="box" x="398" y="30" width="32" height="30"/>
  <text class="cell" x="414" y="49">PS</text>
  <text class="tick" x="414" y="74">7</text>

  <rect class="box" x="430" y="30" width="32" height="30"/>
  <text class="cell" x="446" y="49">D</text>
  <text class="tick" x="446" y="74">6</text>

  <rect class="box" x="462" y="30" width="32" height="30"/>
  <text class="cell" x="478" y="49">A</text>
  <text class="tick" x="478" y="74">5</text>

  <rect class="box" x="494" y="30" width="36" height="30"/>
  <text class="cell" x="512" y="49">PCD</text>
  <text class="tick" x="512" y="74">4</text>

  <rect class="box" x="530" y="30" width="36" height="30"/>
  <text class="cell" x="548" y="49">PWT</text>
  <text class="tick" x="548" y="74">3</text>

  <rect class="box" x="566" y="30" width="36" height="30"/>
  <text class="cell" x="584" y="49">U/S</text>
  <text class="tick" x="584" y="74">2</text>

  <rect class="box-used" x="602" y="30" width="32" height="30"/>
  <text class="cell" x="618" y="49">RW</text>
  <text class="tick" x="618" y="74">1</text>

  <rect class="box-used" x="634" y="30" width="26" height="30"/>
  <text class="cell" x="647" y="49">P</text>
  <text class="tick" x="647" y="74">0</text>

  <text class="note" x="20" y="18">one entry, 64 bits</text>

  <text class="note" x="20" y="104">The address field starts at bit 12 because frames are 4 KiB aligned, so an</text>
  <text class="note" x="20" y="118">address always ends in twelve zeros. Those twelve bits are the flags.</text>
  <text class="note" x="20" y="140">Filled: the flags this part sets. Dashed: yours to use.</text>
</svg>
