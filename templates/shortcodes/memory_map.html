<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-labelledby="mm-title mm-desc" class="memory-map">
  <title id="mm-title">What the frame allocator does with each limine memory map entry</title>
  <desc id="mm-desc">A physical memory map on the left, sorted low to high, with limine entry types. On the right, the bitmap after init: every bit starts at 1 and only the USABLE runs are cleared to 0, including the frames holding the bitmap itself, which stay at 1. The bitmap spans only the first to the last USABLE region, so the low page, the ACPI regions above it and the framebuffer fall outside it entirely.</desc>
  <style>
    /* Cap at close to the viewBox width so the 11px labels land just under the
       14px body text instead of being scaled up past it. */
    .memory-map { width: 100%; max-width: 760px; height: auto; margin-inline: auto; }
    .memory-map text { font-family: var(--font-mono); fill: var(--fg); }
    .memory-map .hdr { font-size: 13px; font-weight: 600; }
    .memory-map .sub { font-size: 11px; opacity: 0.55; }
    .memory-map .addr { font-size: 11px; opacity: 0.6; text-anchor: end; }
    .memory-map .type { font-size: 11px; }
    .memory-map .size { font-size: 11px; opacity: 0.55; text-anchor: end; }
    .memory-map .bits { font-size: 11px; opacity: 0.75; text-anchor: middle; }
    .memory-map .bits-free { font-size: 11px; text-anchor: middle; }
    .memory-map .bits-self { font-size: 10px; fill: var(--cyan); text-anchor: middle; }
    .memory-map .note { font-size: 11px; opacity: 0.55; }
    .memory-map .note-self { font-size: 11px; fill: var(--cyan); }
    .memory-map .dim { opacity: 0.6; }
    .memory-map .self-label { font-size: 10px; fill: var(--cyan); }

    .memory-map .band-free { fill: var(--accent); fill-opacity: 0.28; stroke: var(--accent); stroke-width: 1.5; }
    .memory-map .band-alloc { fill: var(--panel); stroke: var(--accent); stroke-width: 1; stroke-opacity: 0.5; }
    .memory-map .band-self { fill: var(--cyan); fill-opacity: 0.3; stroke: var(--cyan); stroke-width: 1.5; }
    .memory-map .band-out { fill: var(--panel); stroke: var(--accent); stroke-width: 1; stroke-opacity: 0.35; stroke-dasharray: 3 3; }

    .memory-map .gap { fill: none; stroke: var(--accent); stroke-width: 1; stroke-opacity: 0.35; stroke-dasharray: 4 4; }
    .memory-map .brace { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .memory-map .brace-out { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-opacity: 0.4; }
    .memory-map .arrow { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .memory-map .arrow-head { fill: var(--accent); }
  </style>

  <defs>
    <marker id="mm-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon class="arrow-head" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <text class="hdr" x="120" y="22">limine memory map</text>
  <text class="hdr" x="440" y="22">bitmap after init</text>
  <text class="sub" x="440" y="36">0xFF everywhere, then clear USABLE</text>

  <!-- 0x0000_0000 RESERVED, below the first USABLE region -->
  <text class="addr" x="112" y="66">0x0000_0000</text>
  <rect class="band-out" x="120" y="52" width="230" height="22"/>
  <text class="type dim" x="128" y="67">RESERVED</text>
  <text class="size" x="342" y="67">4 KiB</text>

  <!-- 0x0000_1000 USABLE -->
  <text class="addr" x="112" y="90">0x0000_1000</text>
  <rect class="band-free" x="120" y="74" width="230" height="26"/>
  <text class="type" x="128" y="91">USABLE</text>
  <text class="size" x="342" y="91">636 KiB</text>
  <rect class="band-free" x="440" y="74" width="120" height="26"/>
  <text class="bits-free" x="500" y="91">0 0 0 0 0 0</text>

  <!-- 0x0009_F000 RESERVED -->
  <text class="addr" x="112" y="116">0x0009_F000</text>
  <rect class="band-alloc" x="120" y="100" width="230" height="24"/>
  <text class="type" x="128" y="116">RESERVED (VGA, BIOS)</text>
  <text class="size" x="342" y="116">388 KiB</text>
  <rect class="band-alloc" x="440" y="100" width="120" height="24"/>
  <text class="bits" x="500" y="116">1 1 1 1 1 1</text>

  <!-- 0x0010_0000 USABLE, holds the bitmap itself -->
  <text class="addr" x="112" y="140">0x0010_0000</text>
  <rect class="band-self" x="120" y="124" width="230" height="14"/>
  <text class="self-label" x="128" y="135">the bitmap itself</text>
  <text class="self-label" x="342" y="135" text-anchor="end">64 KiB</text>
  <text class="addr" x="112" y="158">0x0011_0000</text>
  <rect class="band-free" x="120" y="138" width="230" height="32"/>
  <text class="type" x="128" y="158">USABLE</text>
  <text class="size" x="342" y="158">1.9 GiB</text>

  <rect class="band-self" x="440" y="124" width="120" height="14"/>
  <text class="bits-self" x="500" y="135">1 1 1 1</text>
  <rect class="band-free" x="440" y="138" width="120" height="32"/>
  <text class="bits-free" x="500" y="158">0 0 0 0 0 0</text>

  <text class="note-self" x="576" y="132">its own frames</text>
  <text class="note-self" x="576" y="146">are marked</text>
  <text class="note-self" x="576" y="160">allocated</text>

  <!-- 0x7EE0_0000 BOOTLOADER_RECLAIMABLE -->
  <text class="addr" x="112" y="186">0x7EE0_0000</text>
  <rect class="band-alloc" x="120" y="170" width="230" height="24"/>
  <text class="type" x="128" y="186">BOOTLOADER_RECLAIMABLE</text>
  <text class="size" x="342" y="186">2 MiB</text>
  <rect class="band-alloc" x="440" y="170" width="120" height="24"/>
  <text class="bits" x="500" y="186">1 1 1 1 1 1</text>

  <!-- 0x7F00_0000 EXECUTABLE_AND_MODULES -->
  <text class="addr" x="112" y="212">0x7F00_0000</text>
  <rect class="band-alloc" x="120" y="194" width="230" height="26"/>
  <text class="type" x="128" y="211">EXECUTABLE_AND_MODULES</text>
  <text class="size" x="342" y="211">16 MiB</text>
  <rect class="band-alloc" x="440" y="194" width="120" height="26"/>
  <text class="bits" x="500" y="211">1 1 1 1 1 1</text>

  <!-- 0x8000_0000 USABLE -->
  <text class="addr" x="112" y="240">0x8000_0000</text>
  <rect class="band-free" x="120" y="220" width="230" height="34"/>
  <text class="type" x="128" y="241">USABLE</text>
  <text class="size" x="342" y="241">112 MiB</text>
  <rect class="band-free" x="440" y="220" width="120" height="34"/>
  <text class="bits-free" x="500" y="241">0 0 0 0 0 0</text>

  <!-- 0x86F0_0000 ACPI_RECLAIMABLE, above the last USABLE region -->
  <text class="addr" x="112" y="270">0x86F0_0000</text>
  <rect class="band-out" x="120" y="254" width="230" height="22"/>
  <text class="type dim" x="128" y="269">ACPI_RECLAIMABLE</text>
  <text class="size" x="342" y="269">128 KiB</text>

  <!-- 0x86F2_0000 ACPI_NVS -->
  <text class="addr" x="112" y="292">0x86F2_0000</text>
  <rect class="band-out" x="120" y="276" width="230" height="22"/>
  <text class="type dim" x="128" y="291">ACPI_NVS</text>
  <text class="size" x="342" y="291">64 KiB</text>

  <!-- 0x86F3_0000 MAPPED_RESERVED -->
  <text class="addr" x="112" y="316">0x86F3_0000</text>
  <rect class="band-out" x="120" y="298" width="230" height="24"/>
  <text class="type dim" x="128" y="314">MAPPED_RESERVED</text>
  <text class="size" x="342" y="314">1 MiB</text>

  <!-- hole -->
  <line class="gap" x1="120" y1="334" x2="350" y2="334"/>
  <text class="note" x="128" y="345">no RAM here</text>

  <!-- 0xFD00_0000 FRAMEBUFFER -->
  <text class="addr" x="112" y="372">0xFD00_0000</text>
  <rect class="band-out" x="120" y="356" width="230" height="24"/>
  <text class="type dim" x="128" y="372">FRAMEBUFFER</text>
  <text class="size" x="342" y="372">8 MiB</text>

  <!-- brace over the bitmap's span, plus the arrow into the bitmap column -->
  <path class="brace" d="M362 74 L356 74 L356 254 L362 254"/>
  <path class="arrow" d="M356 164 L432 164" marker-end="url(#mm-arrow)"/>
  <text class="sub" x="576" y="212">one bit per</text>
  <text class="sub" x="576" y="226">4 KiB frame</text>

  <!-- outside the bitmap -->
  <text class="note" x="576" y="290">outside the</text>
  <text class="note" x="576" y="304">bitmap span</text>
  <path class="brace-out" d="M566 254 L572 254 L572 380 L566 380"/>

  <!-- legend -->
  <rect class="band-free" x="120" y="410" width="16" height="12"/>
  <text class="note" x="144" y="420">free, bit is 0</text>
  <rect class="band-alloc" x="252" y="410" width="16" height="12"/>
  <text class="note" x="276" y="420">allocated, bit is 1</text>
  <rect class="band-out" x="416" y="410" width="16" height="12"/>
  <text class="note" x="440" y="420">no bit at all</text>

  <text class="note" x="120" y="446">The bitmap spans the first USABLE frame to the last. Anything outside that span</text>
  <text class="note" x="120" y="462">has no bit: frame_to_index returns None, and is_frame_allocated treats it as taken.</text>
</svg>
